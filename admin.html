<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f1720"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="assets/css/app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="assets/js/config.js"></script><title>Nova Era — Administração</title><meta name="robots" content="noindex"></head><body>
<p id="aviso" class="msg hide" role="alert"></p>
<section id="login" class="hide"><main><div class="card"><h1>Nova Era</h1><form id="form-login"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required><p><button type="submit">Entrar</button></p></form></div></main></section>
<section id="app" class="hide"><header><h1>Administração</h1><span><a href="index.html">App</a> <button id="sair" class="sec" type="button">Sair</button></span></header>
<main><form id="form-carga" class="card"><h2>Nova carga</h2>
<label for="f-cod">Código / romaneio</label><input id="f-cod" required>
<label for="f-tipo">Tipo</label><select id="f-tipo"><option value="carga">Carga</option><option value="descarga">Descarga</option></select>
<label for="f-cli">Cliente</label><input id="f-cli"><label for="f-dest">Destino</label><input id="f-dest">
<label for="f-veic">Veículo</label><select id="f-veic"></select><label for="f-data">Agendada para</label><input id="f-data" type="datetime-local">
<label for="f-func">Funcionários escalados</label><select id="f-func" multiple size="5"></select>
<p><button id="salvar-carga" type="submit">Salvar carga</button></p></form>
<h2>Cargas</h2><div id="painel"></div><div id="detalhe" class="hide"></div></main></section>
<script type="module" src="assets/js/admin.js"></script></body></html>
