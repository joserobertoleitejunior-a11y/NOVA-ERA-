<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1038">
<title>Como funciona · Confere Carga · Nova Era</title>
<link rel="preload" href="assets/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/apresentacao.css?v=1">
</head>
<body>
<div id="palco" aria-live="off">
  <div class="moldura">
    <section class="coluna-texto" aria-label="Explicação">
      <header class="marca"><span id="logo"></span><span class="selo">Como funciona o app</span></header>
      <div class="cena-texto">
        <p class="etapa" id="etapa"></p>
        <h1 id="titulo"></h1>
        <p class="subtitulo" id="subtitulo"></p>
        <ul class="pontos" id="pontos"></ul>
      </div>
      <p class="legenda" id="legenda" aria-live="polite"></p>
      <div class="controles" role="group" aria-label="Controles">
        <button id="b-ant" type="button" aria-label="Cena anterior" title="Anterior (←)">⏮</button>
        <button id="b-play" type="button" class="principal" aria-label="Pausar" title="Pausar / continuar (espaço)">⏸</button>
        <button id="b-prox" type="button" aria-label="Próxima cena" title="Próxima (→)">⏭</button>
        <div class="progresso" id="progresso" role="tablist" aria-label="Cenas"></div>
        <button id="b-som" type="button" aria-label="Som" title="Som">🔊</button>
        <button id="b-leg" type="button" class="ligado" aria-label="Legenda" title="Legenda (C)">CC</button>
        <button id="b-tela" type="button" aria-label="Tela cheia" title="Tela cheia (F)">⛶</button>
      </div>
    </section>
    <section class="coluna-celular" aria-label="Aplicativo ao vivo">
      <div class="aparelho"><div class="tela-aparelho"><iframe id="app" title="Confere Carga ao vivo" src="about:blank"></iframe></div></div>
    </section>
  </div>
  <div id="destaque" aria-hidden="true"></div>
  <div id="cursor" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2 4 7-3 1-4-7-5 4z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg><i></i></div>
  <div id="inicio" class="inicio">
    <div class="inicio-caixa">
      <span id="logo2"></span>
      <h2>Confere Carga</h2>
      <p>Como funciona o aplicativo da Nova Era</p>
      <button id="b-comecar" type="button">Começar a apresentação</button>
      <small id="aviso-voz">Ative o som do aparelho.</small>
    </div>
  </div>
  <div id="fim" class="inicio" hidden>
    <div class="inicio-caixa"><span id="logo3"></span><h2>Obrigado</h2><p>Confere Carga · Nova Era</p><button id="b-rever" type="button">Ver de novo</button></div>
  </div>
</div>
<script src="assets/js/config.js?v=1"></script>
<script src="assets/js/icones.js?v=1"></script>
<script src="assets/js/apresentacao.js?v=1"></script>
</body>
</html>
