<style>
@font-face { font-family: "Archivo NE"; font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; src: url("assets/fonts/archivo-latin.woff2") format("woff2-variations"), url("assets/fonts/archivo-latin.woff2") format("woff2"); }
:root { --vermelho: #d9141e; --azul: #1a1f8f; --marinho: #0b1038; --tinta: #14172e; --suave: #565a78; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; font-family: "Archivo NE", system-ui, "Segoe UI", Roboto, Arial, sans-serif; color: var(--tinta); -webkit-text-size-adjust: 100%;
  background: radial-gradient(60vmax 40vmax at 0 0, rgba(217, 20, 30, .2), transparent 60%), radial-gradient(60vmax 50vmax at 100% 8%, rgba(26, 31, 143, .22), transparent 60%), linear-gradient(180deg, #f4f5fa, #e8ebf4); }
header { padding: max(14px, env(safe-area-inset-top, 0px)) 18px 12px; background: rgba(255, 255, 255, .85); border-bottom: 4px solid; border-image: linear-gradient(90deg, var(--vermelho), var(--azul)) 1; display: flex; align-items: center; gap: 12px; }

main { max-width: 560px; margin: 0 auto; padding: 22px 16px max(40px, env(safe-area-inset-bottom, 0px)); display: grid; gap: 18px; }
h1 { margin: 0; font-size: 2.3rem; line-height: 1; text-transform: uppercase; font-stretch: 80%; font-weight: 900; color: var(--marinho); }
.sub { margin: 6px 0 0; font-size: 1.1rem; color: var(--suave); }

h2 { margin: 0 0 12px; font-size: 1.2rem; text-transform: uppercase; letter-spacing: .02em; }
.campo { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #eef0f8; margin-bottom: 10px; }
.campo small { display: block; color: var(--suave); font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.campo b { display: block; font: 800 1.45rem ui-monospace, "SFMono-Regular", Menlo, monospace; word-break: break-all; }
.campo button { flex: none; min-height: 44px; padding: 0 14px; border-radius: 12px; border: 0; background: #fff; box-shadow: inset 0 0 0 2px #c9cde0; font: inherit; font-weight: 800; color: var(--azul); cursor: pointer; }
.botoes { display: flex; gap: 6px; }
.grande { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 62px; border-radius: 18px; border: 0; font: inherit; font-size: 1.2rem; font-weight: 800; color: #fff; text-decoration: none; background: linear-gradient(135deg, var(--vermelho), #ff4b55); box-shadow: 0 12px 28px rgba(217, 20, 30, .35); cursor: pointer; }
.video { position: relative; width: 100%; aspect-ratio: 9 / 16; max-height: 78vh; border-radius: 20px; overflow: hidden; background: var(--marinho); box-shadow: 0 10px 30px rgba(11, 16, 56, .25); }
.video video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
li { display: flex; gap: 12px; align-items: flex-start; font-size: 1.08rem; line-height: 1.35; font-weight: 600; }
li::before { content: ""; flex: none; width: 14px; height: 14px; margin-top: 5px; border-radius: 50%; background: linear-gradient(135deg, var(--vermelho), var(--azul)); }
.aviso { padding: 12px 14px; border-radius: 14px; background: #fff3cd; color: #5c4400; font-weight: 600; font-size: .95rem; line-height: 1.4; }
.erro { text-align: center; padding: 40px 10px; }
a.link { color: var(--azul); font-weight: 800; }

<body>

<main id="conteudo"></main>
<script src="assets/js/config.js"></script>
<script src="assets/js/icones.js"></script>
<script src="assets/js/pacote.js"></script>
<script>
(() => {

    vendedor: { dur: "2 min", nome: "Vendedor", video: "vendedor", diario: ["Lance as notas dos seus clientes na fila", "Veja o estoque disponível antes de prometer a entrega", "Acompanhe as suas cargas e mande o rastreio ao cliente pelo WhatsApp", ["Pergunte ao assistente: ele lança a nota e acha o rastreio por você", "ia"]] },
    expedicao: { dur: "2 min", nome: "Expedição", video: "expedicao", diario: ["Acompanhe o painel: uma frase diz se está tudo certo", ["Resolva os avisos: diferença de carga, estoque baixo, nota parada", "avisos", "Resolva os avisos de carga com diferença"], ["Decida o ajuste quando a contagem do estoque não bater", "estoque"]] },
    administrativo: { dur: "1 min 40", nome: "Administrativo", video: "administrativo", diario: [["Lance notas e importe o XML", "xml", "Lance as notas na fila"], "Cadastre equipe, caminhões e produtos", "Dê uma senha nova para quem esquecer"] },
    diretoria: { dur: "1 min 20", nome: "Diretoria", video: "diretoria", diario: ["Veja a empresa em uma frase na tela inicial", ["Abra o resumo completo quando quiser os detalhes", "resumo", "Veja as cargas que saíram, com foto e conferência"], ["Pergunte ao assistente de inteligência artificial", "ia"]] },
  };
  const el = (t, a = {}, ...f) => { const n = document.createElement(t); for (const [k, v] of Object.entries(a)) { if (v == null || v === false) continue; k === "class" ? (n.className = v) : k === "html" ? (n.innerHTML = v) : k.startsWith("on") ? n.addEventListener(k.slice(2), v) : n.setAttribute(k, v); } f.flat().forEach((x) => x != null && n.append(x instanceof Node ? x : document.createTextNode(x))); return n; };
  const raiz = document.getElementById("conteudo");

  if (!d || !d.u) { raiz.append(el("div", { class: "cartao erro" }, el("h1", {}, "Link incompleto"), el("p", { class: "sub" }, "Peça um link novo para a administração da Nova Era."))); return; }
  const K = window.NEPacoteRegras; const tem = (r) => !K || K.tem(d.k, r);   // d.k: o pacote de quem mandou o link (link antigo: tudo ligado)

  const cp = (rot, v) => { const b = el("button", { type: "button" }, "Copiar"); b.addEventListener("click", () => copiar(v, b)); return b; };
  const app = location.href.replace(/[?#].*$/, "").replace(/[^/]*$/, "") + "app.html";

    el("div", {}, el("h1", {}, primeiro ? `Olá, ${primeiro}!` : "Bem-vindo!"), el("p", { class: "sub" }, `Você vai usar o Confere Carga da Nova Era como ${f.nome}.`)),
    el("section", { class: "cartao" }, el("h2", {}, "Seu acesso"),
      el("div", { class: "campo" }, el("div", {}, el("small", {}, "Usuário"), el("b", {}, d.u)), cp("Usuário", d.u)),
      d.s ? el("div", { class: "campo" }, el("div", {}, el("small", {}, "Senha"), senha), el("div", { class: "botoes" }, ver, cp("Senha", d.s))) : null,
      el("a", { class: "grande", id: "abrir-app", href: `${app}#u=${encodeURIComponent(d.u)}` }, "Abrir o aplicativo")),
    tem("videos") ? el("section", { class: "cartao" }, el("h2", {}, `Veja como usar (${f.dur})`),
      // Vídeo MP4 de verdade, da função da pessoa. Antes era um player ao vivo que deixava o app em "modo teste" no aparelho.
      el("div", { class: "video" }, el("video", { controls: "", playsinline: "", preload: "metadata", poster: `videos/${f.video}-poster.jpg`, src: `videos/${f.video}-vertical.mp4`, "aria-label": `Vídeo tutorial: ${f.nome}` })),
      el("p", { style: "margin:10px 0 0" }, el("a", { class: "link", href: `videos/${f.video}-vertical.mp4`, target: "_blank", rel: "noopener" }, "Abrir o vídeo em tela cheia"))) : null,
    el("section", { class: "cartao" }, el("h2", {}, "No dia a dia"), el("ul", {}, f.diario.map((t) => (Array.isArray(t) ? (tem(t[1]) ? t[0] : t[2]) : t)).filter(Boolean).map((t) => el("li", {}, t)))),
    el("p", { class: "aviso" }, `Guarde este link: ele mostra seu acesso${tem("videos") ? " e o vídeo" : ""} sempre que precisar. Não mande para ninguém: quem tem o link entra como você. Esqueceu a senha? Na tela de entrada toque em “Esqueci minha senha”.`)
  );
})();
